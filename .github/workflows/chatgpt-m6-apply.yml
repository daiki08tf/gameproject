name: Temporary M6 Apply and Validate

on:
  push:
    branches:
      - chatgpt/observed-branches-m6-deep-green-absence
    paths:
      - scripts/apply-observed-branches-m6.py
      - scripts/patch-m6-legacy-regressions.py
      - .github/workflows/chatgpt-m6-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/observed-branches-m6-deep-green-absence
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Observed Branches M6
        run: |
          python scripts/apply-observed-branches-m6.py
          python scripts/patch-m6-legacy-regressions.py
          python -c "from pathlib import Path; p=Path('tests/observed-branches-m6.test.js'); s=p.read_text(); s=s.replace('const stage=findStage(stageId);', 'const found=findStage(stageId);\n    const stage=found?.stage;'); p.write_text(s)"

      - name: Focused M6 regression
        run: node --test tests/observed-branches-m6.test.js tests/core-loop-clr21-m4.test.js tests/observed-branches-m2.test.js

      - name: Full regression suite
        id: full
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee chatgpt-m6-full-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist full regression failure log
        if: steps.full.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-m6-full-test.log
          git commit -m "test: capture M6 full regression failure"
          git push origin HEAD:chatgpt/observed-branches-m6-deep-green-absence
          exit 1

      - name: Syntax gate
        if: steps.full.outputs.status == '0'
        run: npm run test:syntax

      - name: Emoji gate
        if: steps.full.outputs.status == '0'
        run: node scripts/uix-emoji-check.js

      - name: Diff check
        if: steps.full.outputs.status == '0'
        run: git diff --check

      - name: Commit validated implementation
        if: steps.full.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f chatgpt-m6-full-test.log .github/workflows/chatgpt-m6-apply.yml scripts/apply-observed-branches-m6.py scripts/patch-m6-legacy-regressions.py scripts/patch-m6-tests.py scripts/patch-m6-tests-v2.py
          git add -A
          git commit -m "feat: implement Observed Branches M6 deep green absence"
          git push origin HEAD:chatgpt/observed-branches-m6-deep-green-absence
